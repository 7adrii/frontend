<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuentes de tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/index_style.css">
    <link rel="stylesheet" href="./css/pet-form_style.css">

    <!-- Scripts js -->
    <script src="./js/clock_header_script.js" defer></script>
    <script src="./js/bootstrap.bundle.min.js" defer></script>
    <script src="./js/pet-form-page_script.js"></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                    <img src="./img/list.svg" alt="Icono menú">
                </button>
                <div class="d-flex align-items-center mx-auto">
                    <a class="navbar-brand mb-2 mb-lg-0" href="#">
                        <img src="./img/logo.png" alt="Logo" class="img-header">
                    </a>
                    <div class="collapse navbar-collapse">
                        <p class="mb-0 me-3">Clínica veterinaria</p>
                    </div>
                </div>

                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#"><i class="bi bi-grid"></i>
                                Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#"><i class="bi bi-calendar"></i>
                                Calendario de citas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#"><i
                                    class="bi bi-file-earmark-medical"></i> Historial clínico</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="pet-list-page.html"><i
                                    class="fa-solid fa-paw"></i>
                                Clientes/Mascotas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#"><i class="bi bi-chat-list"></i>
                                Consultas</a>
                        </li>
                    </ul>
                </div>

                <div id="clock" class="clock"></div>
            </div>
        </nav>

        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar"
            aria-labelledby="offcanvasNavbarLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Vettion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><i class="bi bi-grid"></i>
                            Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><i class="bi bi-calendar"></i>
                            Calendario de citas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><i
                                class="bi bi-file-earmark-medical"></i> Historial clínico</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><i class="fa-solid fa-paw"></i>
                            Clientes/Mascotas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><i class="bi bi-chat-list"></i>
                            Consultas</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <form id="form-new-pet">
        <h4>Nuevo Registro</h4>
        <div class="form-section">
            <h5>Datos del dueño</h5>
            <div class="line-form">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Nombre*</label>
                    <input type="text" class="form-control" placeholder="Ej: Juan">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Apellidos*</label>
                    <input type="text" class="form-control" placeholder="Ej: Pérez García">
                </div>
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Teléfono*</label>
                <input type="text" class="form-control" placeholder="Ej: 612 345 678">
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email*</label>
                <input type="email" class="form-control" placeholder="Ej: juan.perez@gmail.com">
            </div>
        </div>

        <div class="form-section">
            <h5>Datos de la mascota</h5>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Nombre*</label>
                <input type="text" class="form-control" placeholder="Ej: Lana">
            </div>
            <div class="line-form">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Especie*</label>
                    <input type="text" class="form-control" placeholder="Ej: Perro">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Raza</label>
                    <input type="text" class="form-control" placeholder="Ej: Golden Retriever">
                </div>
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Peso*</label>
                <input type="text" class="form-control" placeholder="Ej: 25 kg">
            </div>
            <div class="mb-3">
                <label for="disabledSelect" class="form-label">Sexo*</label>
                <select id="disabledSelect" class="form-select">
                    <option>Macho</option>
                    <option>Hembra</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Fecha de nacimiento*</label>
                <input type="date" class="form-control">
            </div>
        </div>

        <div class="form-section">
            <h5>Alergias</h5>
            <button type="button" class="btn btn-primary" id="btn-add">Introducir nueva alergia</button>
            <div id="container-allergies">

            </div>
            <template id="allergy-item">
                <div class="form-section" id="allergy-block">
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Alérgeno*</label>
                        <input type="text" class="form-control" placeholder="Ej: Picadura de pulga">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Método de diagnóstico*</label>
                        <input type="text" class="form-control" placeholder="Ej: Picadura de pulga">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Sintomatología*</label>
                        <input type="text" class="form-control" placeholder="Ej: Ronchas, estornudos">
                    </div>
                    <div class="mb-3">
                        <label for="disabledSelect" class="form-label">Nivel de severidad*</label>
                        <select id="disabledSelect" class="form-select">
                            <option>Leve</option>
                            <option>Moderada</option>
                            <option>Grave/Crítica</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Tratamiento de urgencia*</label>
                        <input type="text" class="form-control" placeholder="Ej: Ronchas, estornudos">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Fecha de detección*</label>
                        <input type="date" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-secondary" id="btn-remove" aria-label="Close">Eliminar</button>
                </div>
            </template>
        </div>

        <div class="btns">
            <a href="pet-list-page.html">
                <button type="submit" class="btn btn-primary">Registrar</button>
            </a>
            <a href="pet-list-page.html">
                <button type="button" class="btn btn-secondary">Cancelar</button>
            </a>
        </div>
    </form>

</body>

</html>
